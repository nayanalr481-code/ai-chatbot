<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot | n8n Project</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .chat {
      width: 100%;
      max-width: 460px;
      height: 680px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 15px 45px rgba(0,0,0,.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #4f46e5;
      color: white;
      padding: 22px;
    }
    .header h1 { margin: 0 0 5px; font-size: 22px; }
    .header p { margin: 0; opacity: .9; font-size: 13px; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      background: #f8fafc;
    }
    .msg {
      max-width: 82%;
      padding: 12px 15px;
      margin: 9px 0;
      border-radius: 16px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .bot {
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }
    .user {
      background: #4f46e5;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 13px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }
    #input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }
    #input:focus { border-color: #4f46e5; }
    button {
      border: 0;
      border-radius: 12px;
      padding: 0 18px;
      background: #4f46e5;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .footer {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
  <main class="chat">
    <header class="header">
      <h1>🤖 AI Chatbot</h1>
      <p>Powered by n8n automation</p>
    </header>

    <section id="messages">
      <div class="msg bot">Hello! 👋 I'm your AI chatbot. How can I help you?</div>
    </section>

    <div class="input-area">
      <input id="input" type="text" placeholder="Type your message..." autocomplete="off">
      <button id="send">Send</button>
    </div>
    <div class="footer">AI responses may not always be accurate.</div>
  </main>

  <script>
    const N8N_URL = "https://nayana243.app.n8n.cloud/webhook/website-chat";

    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const messages = document.getElementById("messages");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message || send.disabled) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;

      const thinking = addMessage("Thinking...", "bot");

      try {
        const response = await fetch(N8N_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        if (!response.ok) {
          throw new Error("Server returned " + response.status);
        }

        const data = await response.json();
        thinking.remove();

        // Supports the expected { "reply": "..." } response.
        // Also handles common n8n response shapes.
        const reply =
          data.reply ??
          data.output ??
          data.response ??
          data.text ??
          (data.data && (data.data.reply ?? data.data.output)) ??
          "I received your message, but no reply was returned.";

        addMessage(String(reply), "bot");
      } catch (error) {
        thinking.remove();
        addMessage(
          "Sorry, I couldn't connect to the chatbot. Please check the n8n workflow and webhook.",
          "bot"
        );
        console.error(error);
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
